<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeLite - Mon Profil</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="profil.js" defer></script>
</head>
<body>
    <header>
        <a href="index.html" class="logo" style="text-decoration: none; color: var(--text-main);">STAKE<span>LITE</span></a>
        <div class="header-right">
        </div>
    </header>

    <main style="align-items: center; padding-top: 50px;">
        <div class="controls" style="text-align: left; max-width: 400px; width: 100%;">
            <h2 style="margin-bottom: 20px; text-align: center;">⚙️ Mon Profil</h2>
            
            <div class="input-group">
                <label>Changer le Pseudo</label>
                <input type="text" id="update-pseudo" placeholder="Chargement...">
            </div>

            <div class="input-group">
                <label>Changer l'Email</label>
                <input type="email" id="update-email" placeholder="Nouvel email...">
            </div>

            <div class="input-group">
                <label>Changer le Mot de passe</label>
                <input type="password" id="update-password" placeholder="Nouveau mot de passe...">
            </div>

            <button class="main-btn green" style="margin-top: 10px;" onclick="updateProfile()">SAUVEGARDER</button>
        </div>
    </main>
</body>
<footer class="site-footer">
    <div class="footer-content">
        <div class="footer-links">
            <a href="/mentions-legales">Mentions Légales</a>
            <a href="/confidentialite">Politique de Confidentialité</a>
            <a href="/contact">Contact</a>
            <a href="/faq">FAQ & Règles</a>
        </div>
        <div class="footer-copy">
            <p>&copy; 2026 StakeLite. Tous droits réservés.</p>
        </div>
    </div>
</footer>
</html>
