<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StakeLite - Mines</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../main.js" defer></script>
    <script src="mines.js" defer></script>
</head>
<body>
    <header>
        <a href="../index.html" class="logo" style="text-decoration: none; color: var(--text-main);">STAKE<span>LITE</span></a>
        <div class="header-right">
            <div class="balance-box"><span id="global-balance">0.00</span> GC</div>
            <div class="user-menu">
                <div class="avatar" id="user-avatar" onclick="toggleUserMenu()">?</div>
                <div class="dropdown" id="user-dropdown">
                    <a href="../profil.html" class="dropdown-header" style="text-decoration: none; display: block; cursor: pointer; transition: background-color 0.2s;">
                        <div id="dropdown-pseudo" style="margin-bottom: 5px;">Joueur</div>
                    </a>
                    <button class="dropdown-btn" onclick="logout()">Se déconnecter</button>
                </div>
            </div>
        </div>
    </header>

    <main style="align-items: center; padding-top: 30px;">
        <section id="mines-section" class="game-section active">
            <div class="grid-container" id="grid"></div>
            <div class="controls">
                <div class="mines-row">
                    <label style="margin:0; align-self:center;">Nombre de mines</label>
                    <button class="m-btn active" onclick="setMines(1, this)">1</button>
                    <button class="m-btn" onclick="setMines(3, this)">3</button>
                    <button class="m-btn" onclick="setMines(5, this)">5</button>
                    <button class="m-btn" onclick="setMines(10, this)">10</button>
                </div>

                <label>Montant de la mise</label>
                <input type="number" id="bet-amount" value="100" min="1">
                
                <button class="main-btn green" id="play-btn" onclick="startGame()">JOUER</button>
                <button class="main-btn" id="cashout-btn" onclick="cashout()" style="display: none; background-color: var(--bg-main); color: white; margin-top: 10px;">ENCAISSER</button>
            </div>
        </section>
    </main>

    <div id="login-overlay" class="overlay">
        <div class="login-box">
            <h2 id="auth-title">Connexion à StakeLite</h2>
            <div class="auth-form">
                <div id="pseudo-group" class="input-group" style="display: none;">
                    <label>Pseudo</label>
                    <input type="text" id="auth-pseudo" placeholder="Ex: Flo...">
                </div>
                <div class="input-group">
                    <label>Adresse Email</label>
                    <input type="email" id="auth-email" placeholder="exemple@mail.com">
                </div>
                <div class="input-group">
                    <label>Mot de passe</label>
                    <input type="password" id="auth-password" placeholder="••••••••">
                </div>
                <button id="auth-main-btn" class="main-btn green" onclick="handleAuth()">SE CONNECTER</button>
            </div>
            <p class="auth-switch">
                <span id="auth-switch-text">Pas encore de compte ?</span> 
                <a href="#" id="auth-switch-link" onclick="toggleAuthMode(event)">S'inscrire</a>
            </p>
        </div>
    </div>
</body>
<footer class="site-footer">
    <div class="footer-content">
        <div class="footer-links">
            <a href="/mentions-legales">Mentions Légales</a>
            <a href="/confidentialite">Politique de Confidentialité</a>
            <a href="/contact">Contact</a>
            <a href="/faq">FAQ & Règles</a>
        </div>
        <div class="footer-copy">
            <p>&copy; 2026 StakeLite. Tous droits réservés.</p>
        </div>
    </div>
</footer>
</html>
